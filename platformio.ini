; PlatformIO Project Configuration File for ORCHESTRA Edge Firmware
; ESP32 Classroom Doorway Terminal (NodeMCU-32S / ESP32-WROOM-32)
; Hardware: SPI MFRC522 RFID, I2C SSD1306 OLED (128x64), 4x4 Keypad, Piezo Buzzer, Status LEDs

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600
upload_port = COM3
monitor_port = COM3

build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -D CONFIG_ARDUHAL_LOG_COLORS=1

lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    chris--a/Keypad @ ^3.1.1
    bblanchon/ArduinoJson @ ^7.0.4
